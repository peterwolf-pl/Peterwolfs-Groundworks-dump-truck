name: Build

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dump truck
        uses: actions/checkout@v4

      - name: Checkout Groundworks core
        uses: actions/checkout@v4
        with:
          repository: peterwolf-pl/peterwolfs-groundworks
          path: groundworks-core

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Publish Groundworks core locally
        working-directory: groundworks-core
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Build dump truck
        run: |
          chmod +x gradlew
          ./gradlew clean test build
