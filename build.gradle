plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenLocal(); mavenCentral() }
loom {
	splitEnvironmentSourceSets()
	mods {
		"pw_groundworks_dump_truck" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "com.piotrek.groundworks:pw_groundworks:${project.groundworks_version}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'pw_groundworks_dump_truck_test'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
test { useJUnitPlatform() }
processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
	withSourcesJar()
	toolchain { languageVersion = JavaLanguageVersion.of(21) }
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
